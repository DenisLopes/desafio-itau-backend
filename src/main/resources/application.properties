spring.application.name=desafio-itau-backend

# Janela temporal (Duration) considerada no cálculo das estatísticas.
# Default de 60s conforme especificação do desafio. Aceita formatos ISO-8601
# (PT60S, PT2M) ou abreviados (60s, 2m).
estatistica.janela=60s

# Ambiente de produção: desabilita stacktrace no ProblemDetail.
server.error.include-message=always
server.error.include-stacktrace=never

# Actuator: expõe apenas o essencial (health).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger UI disponível em /swagger-ui.html (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
